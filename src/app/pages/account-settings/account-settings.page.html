<ion-header>
    <ion-toolbar>
        <ion-buttons slot="start">
            <ion-button (click)="back()"><ion-icon slot="icon-only" name="arrow-back"></ion-icon></ion-button>
        </ion-buttons>
    </ion-toolbar>
</ion-header>

<ion-content class="ion-padding">
    <h1>Account Settings</h1>

    <ion-list lines="none">
        <ion-item>
        <ion-label>
            <p>Username</p>
            <h2>{{ user.username }}</h2>
        </ion-label>
        </ion-item>
        <ion-item>
        <ion-label>
            <p>Email</p>
            <h2>{{ user.email }}</h2>
        </ion-label>
        </ion-item>
    </ion-list>

  <ion-button expand="block" (click)="changePassword()">Change Password</ion-button>

  <div class="logout-wrap">
    <ion-button fill="clear" color="danger" (click)="logout()">Log Out</ion-button>
  </div>
</ion-content>
