<ion-header>
  <ion-toolbar>
    <ion-buttons slot="start">
      <ion-button (click)="back()"><ion-icon slot="icon-only" name="arrow-back"></ion-icon></ion-button>
    </ion-buttons>
    <ion-title>Folder</ion-title>
  </ion-toolbar>
</ion-header>

<ion-content class="ion-padding">
  <ion-list>
    <ion-item lines="none" button (click)="selectCategory('All')">
      <ion-label>All</ion-label>
    </ion-item>
    <ion-item *ngFor="let c of categories" lines="none" button (click)="selectCategory(c.name)">
      <ion-label>{{ c.name }}</ion-label>
    </ion-item>
  </ion-list>

  <ion-card class="new-folder" button (click)="newFolder()">
    <ion-icon name="add" class="plus"></ion-icon>
    <span>New Folder</span>
  </ion-card>
</ion-content>
